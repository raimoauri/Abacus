<title>Import Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Two modes (Goods · Books) over one shell: sticky wordmark bar → tab rail → summary-then-detail views.
   Palette: liturgical violet-ink + muted brass on warm ledger paper; semantic good/warn/bad for margin health. */
:root{
  --paper:#F1EFEA; --surface:#FBFAF7; --surface-2:#F6F4EF;
  --ink:#24202A; --muted:#716B78; --faint:#9A93A1;
  --line:#E2DED6; --line-strong:#D3CDC2;
  --brand:#533A6B; --brand-soft:#6E5187; --brass:#9C7A33; --brass-soft:#B8914A;
  --good:#2E7256; --warn:#9A6E20; --bad:#9E3B38;
  --good-bg:#E6F0EA; --warn-bg:#F4ECD8; --bad-bg:#F3E3E2;
  --star:#B98A2E; --oncolor:#fff;
  --shadow:0 1px 2px rgba(40,30,55,.05),0 6px 20px rgba(40,30,55,.06);
  --radius:10px; --radius-sm:7px;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"Hanken Grotesk",system-ui,-apple-system,Segoe UI,sans-serif;
  --serif:"Spectral",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#17151B; --surface:#201C27; --surface-2:#262131;
  --ink:#ECE8F0; --muted:#A49CAE; --faint:#7C7488;
  --line:#322C3B; --line-strong:#423A4E;
  --brand:#C2A6DC; --brand-soft:#A98FC4; --brass:#D2A84E; --brass-soft:#C19A52;
  --good:#5FBF93; --warn:#D8A94E; --bad:#E08A86;
  --good-bg:#1C2C25; --warn-bg:#2E2718; --bad-bg:#2E1E1E;
  --star:#D2A84E; --oncolor:#17151B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#17151B; --surface:#201C27; --surface-2:#262131;
  --ink:#ECE8F0; --muted:#A49CAE; --faint:#7C7488;
  --line:#322C3B; --line-strong:#423A4E;
  --brand:#C2A6DC; --brand-soft:#A98FC4; --brass:#D2A84E; --brass-soft:#C19A52;
  --good:#5FBF93; --warn:#D8A94E; --bad:#E08A86;
  --good-bg:#1C2C25; --warn-bg:#2E2718; --bad-bg:#2E1E1E;
  --star:#D2A84E; --oncolor:#17151B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
.appbar-in{max-width:1140px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.wordmark{font-family:var(--serif);font-weight:600;font-size:21px;letter-spacing:.2px;color:var(--ink);display:flex;align-items:baseline;gap:9px;line-height:1}
.wordmark .mk{color:var(--brass)}
.wordmark .sub{font-family:var(--sans);font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.3px}
.appbar .spacer{flex:1}
.iconbtn{appearance:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:var(--radius-sm);
  height:34px;padding:0 11px;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.iconbtn:hover{border-color:var(--brand-soft)}
.iconbtn.ghost{background:transparent}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--radius-sm);overflow:hidden}
.seg button{appearance:none;border:0;background:var(--surface);color:var(--muted);font-weight:600;font-size:12.5px;padding:7px 14px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--oncolor)}

.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 55px);z-index:30;background:var(--paper);border-bottom:1px solid var(--line)}
.rail-in{max-width:1140px;margin:0 auto;padding:0 10px;display:flex;gap:2px;overflow-x:auto}
.rail-in::-webkit-scrollbar{height:0}
.tab{appearance:none;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:13.5px;
  padding:12px 13px 11px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brass)}
.tab .pip{background:var(--brand);color:var(--oncolor);border-radius:20px;font-size:10.5px;min-width:17px;height:17px;padding:0 5px;
  display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}

.wrap{max-width:1140px;margin:0 auto;padding-block:22px;padding-inline:16px}
.view{display:flex;flex-direction:column;gap:20px}
.eyebrow{font-family:var(--serif);font-style:italic;color:var(--brand);font-size:15px;margin-bottom:-6px}
.sectitle{font-family:var(--serif);font-weight:600;font-size:19px}
.rowbetween{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

.banner{display:flex;gap:12px;align-items:center;background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);
  color:var(--ink);border-radius:var(--radius);padding:11px 14px;font-size:13px}
.banner b{color:var(--warn)}
.banner .spacer{flex:1}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;display:flex;flex-direction:column;gap:3px}
.tile .k{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.2px}
.tile .v{font-family:var(--serif);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .v.sm{font-size:19px}
.tile .foot{font-size:11px;color:var(--faint)}
.tile.lead{background:linear-gradient(180deg,color-mix(in srgb,var(--brand) 10%,var(--surface)),var(--surface));border-color:color-mix(in srgb,var(--brand) 25%,var(--line))}
.tile.lead .v{color:var(--brand)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.panel-h{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.panel-h h3{font-family:var(--serif);font-size:15.5px;font-weight:600}
.panel-b{padding:6px 2px}
.cols2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
.split{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{position:sticky;top:0;background:var(--surface-2);color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.3px;
  text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
tbody td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover td{background:var(--surface-2)}
td .name{font-weight:600}
td .meta{color:var(--faint);font-size:11.5px}
.code{font-family:var(--mono);font-size:12px;color:var(--muted)}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;
  background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip.cat{background:color-mix(in srgb,var(--brand) 9%,var(--surface));color:var(--brand-soft);border-color:color-mix(in srgb,var(--brand) 18%,var(--line))}
.chip.vat{background:color-mix(in srgb,var(--brass) 14%,var(--surface));color:var(--brass);border-color:color-mix(in srgb,var(--brass) 28%,var(--line))}
.chip.own{background:color-mix(in srgb,var(--brass) 16%,var(--surface));color:var(--brass);border-color:color-mix(in srgb,var(--brass) 30%,var(--line))}
.chip.nosale{background:var(--surface-2);color:var(--faint);border-color:var(--line-strong)}
tr.nosale td{opacity:.72}
.health{display:inline-flex;align-items:center;gap:7px;font-variant-numeric:tabular-nums;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.good{background:var(--good)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
.txt-good{color:var(--good)} .txt-warn{color:var(--warn)} .txt-bad{color:var(--bad)}
.star{background:none;border:0;cursor:pointer;font-size:16px;line-height:1;color:var(--faint);padding:2px}
.star.on{color:var(--star)}

.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.field{position:relative;display:flex;align-items:center}
input[type=text],input[type=password],input[type=date],input[type=number],select,textarea{
  font-family:var(--sans);font-size:13.5px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--brand) 50%,transparent);outline-offset:1px;border-color:var(--brand-soft)}
.search{min-width:210px}
.filter{min-width:140px}
label.lab{font-size:11.5px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}

.btn{appearance:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-weight:600;font-size:13px;
  border-radius:var(--radius-sm);padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:var(--brand-soft)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--oncolor)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.danger:hover{background:var(--bad-bg)}
.btn.link{border:0;background:none;color:var(--brand-soft);padding:4px 2px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.catrow{display:grid;grid-template-columns:1fr auto;gap:10px 12px;align-items:center;padding:7px 15px}
.catbar{height:7px;border-radius:5px;background:var(--surface-2);overflow:hidden;grid-column:1/-1}
.catbar>i{display:block;height:100%;background:var(--brand-soft);border-radius:5px}
.catname{font-weight:600;font-size:13px}
.catval{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}

.scrim{position:fixed;inset:0;background:rgba(20,15,28,.5);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:28px 14px;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:640px;margin:auto}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal-h h3{font-family:var(--serif);font-size:18px;font-weight:600}
.modal-b{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.x{appearance:none;border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;padding:4px}

.preview{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px 14px}
.preview .pk{font-size:11px;color:var(--muted);font-weight:600}
.preview .pv{font-family:var(--mono);font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.hintrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.valid{font-size:11px;font-weight:600}
.valid.ok{color:var(--good)} .valid.no{color:var(--bad)}

.empty{text-align:center;color:var(--muted);padding:40px 18px;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty .big{font-family:var(--serif);font-size:18px;color:var(--ink)}
.note{font-size:12px;color:var(--muted)}
textarea.io{font-family:var(--mono);font-size:11.5px;min-height:150px;white-space:pre;overflow:auto;line-height:1.5}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:120;background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:30px;font-weight:600;font-size:13px;box-shadow:var(--shadow)}
.invhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:11px 15px;background:var(--surface-2);border-bottom:1px solid var(--line);cursor:pointer}
.invhead .no{font-family:var(--mono);font-weight:500;color:var(--brand-soft)}
.invhead .sup{font-weight:600}
.invhead .mini{color:var(--muted);font-size:12px;margin-left:auto;font-variant-numeric:tabular-nums}
.caret{transition:transform .15s ease;color:var(--muted)}
.caret.open{transform:rotate(90deg)}


.statchip{appearance:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:20px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.statchip b{font-variant-numeric:tabular-nums}
.statchip.bad{background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad) 40%,var(--line));color:var(--bad)}
.statchip.warn{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 40%,var(--line));color:var(--warn)}
.statchip:hover{filter:brightness(.97)}
.chiprow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.barlab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;font-weight:600;font-size:13px}
.hbar{display:flex;height:12px;border-radius:7px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.hbar>i{display:block;height:100%}
.hblegend{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;font-size:11.5px;color:var(--muted)}
.hblegend span{display:inline-flex;align-items:center;gap:5px}
.hblegend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.quickadd{display:grid;grid-template-columns:1fr 70px 96px 96px auto;gap:8px;padding:10px 15px;border-top:1px solid var(--line);background:var(--surface-2);align-items:center}
.quickadd input{width:100%}
.bulkbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:color-mix(in srgb,var(--brand) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--brand) 25%,var(--line));border-radius:var(--radius);padding:9px 13px}
.bulkbar b{font-variant-numeric:tabular-nums}
tr.selrow td{background:color-mix(in srgb,var(--brand) 7%,var(--surface))!important}
.idots{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.idot{font-size:9.5px;font-weight:700;letter-spacing:.2px;padding:1px 5px;border-radius:4px;text-transform:uppercase;white-space:nowrap}
.idot.bad{background:var(--bad-bg);color:var(--bad)}
.idot.warn{background:var(--warn-bg);color:var(--warn)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--brand);cursor:pointer;vertical-align:middle}
@media (max-width:820px){ .cols2{grid-template-columns:1fr} .tiles{grid-template-columns:repeat(2,1fr)} .split{grid-template-columns:1fr} }
@media (max-width:560px){ .grid2,.grid3{grid-template-columns:1fr} .preview{grid-template-columns:repeat(2,1fr)} .wordmark .sub{display:none} .quickadd{grid-template-columns:1fr 1fr} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="root"></div>

/* ---------- pricing ---------- */
function invoiceUnits(ws,invoiceId,override){
  let u=0;for(const it of ws.items){if(it.invoiceId!==invoiceId)continue;if(it.source==="own")continue;
    if(override&&it.id===override.id)continue;u+=(+it.qty||0);}
  if(override&&override.invoiceId===invoiceId&&override.source!=="own")u+=(+override.qty||0);return u;}
function deriveGoods(ws,item){
  const inv=ws.invoices.find(i=>i.id===item.invoiceId);
  const transport=inv?(+inv.transport||0):0;
  const units=invoiceUnits(ws,item.invoiceId);
  const rtc=units>0?transport/units:0;
  const qty=+item.qty||0, goods=+item.goods||0;
  const vat=item.vat!=null?+item.vat:ws.settings.defaultVat;
  const costVat=(inv&&inv.vatInCost)?r2(goods*vat/(1+vat)):0;
  const netGoods=goods-costVat;
  const unitCost=r2((qty>0?netGoods/qty:0)+rtc);
  const mult=item.multiplier!=null?+item.multiplier:ws.settings.defaultMultiplier;
  const suggested=r2(unitCost*mult*(1+vat));
  const retail=+item.retail||0;
  const vatAmt=retail>0?r2(retail*vat/(1+vat)):0;
  const profit=retail>0?r2((retail-vatAmt)-unitCost):0;
  const margin=retail>0?profit/retail:null;
  return {rtc,costVat,netGoods,unitCost,vat,mult,suggested,retail,vatAmt,profit,margin,qty,goods,
    lineRetail:retail*qty,lineProfit:profit*qty,lineVat:vatAmt*qty,lineGoods:goods,lineNet:netGoods,lineUnits:qty,lineCostVat:costVat};
}
function deriveBook(ws,item,override){
  const s=ws.settings, retailVat=s.retailVat;
  const qty=override?(+override.qty||0):(+item.qty||0);
  const goods=override?(+override.goods||0):(+item.goods||0);
  const source=override?override.source:item.source;
  let costVat=0, rtc=0;
  if(source==="own"){ costVat=r2(goods*s.productionVat/(1+s.productionVat)); }
  else{
    const invId=override?override.invoiceId:item.invoiceId;
    const inv=ws.invoices.find(i=>i.id===invId);
    if(inv&&inv.vatInCost) costVat=r2(goods*s.purchaseVat/(1+s.purchaseVat));
    const units=override?invoiceUnits(ws,invId,{id:(override.id||null),invoiceId:invId,qty,source}):invoiceUnits(ws,invId);
    const transport=inv?(+inv.transport||0):0;
    rtc=units>0?transport/units:0;
  }
  const netGoods=goods-costVat;
  const unitCost=r2((qty>0?netGoods/qty:0)+rtc);
  const mult=(override?override.multiplier:item.multiplier)!=null?+(override?override.multiplier:item.multiplier):(source==="own"?s.multiplierOwn:s.multiplierPurchased);
  const suggested=r2(unitCost*mult*(1+retailVat));
  const retail=override?(+override.retail||0):(+item.retail||0);
  const vatAmt=retail>0?r2(retail*retailVat/(1+retailVat)):0;
  const profit=retail>0?r2((retail-vatAmt)-unitCost):0;
  const margin=retail>0?profit/retail:null;
  return {rtc,costVat,netGoods,unitCost,vat:retailVat,mult,suggested,retail,vatAmt,profit,margin,qty,goods,
    lineRetail:retail*qty,lineProfit:profit*qty,lineVat:vatAmt*qty,lineGoods:goods,lineNet:netGoods,lineUnits:qty,lineCostVat:costVat};
}
function derive(cfg,item){return cfg.mode==="books"?deriveBook(cfg.ws,item):deriveGoods(cfg.ws,item);}

  const profit=retail>0?r2((retail-vatAmt)-unitCost):0;const margin=retail>0?profit/retail:null;

function totals(cfg){
  const ws=cfg.ws;let goods=0,units=0,retail=0,vat=0,profit=0,costVat=0,netP=0,netO=0,titP=0,titO=0;

function normCode(s){return String(s||"").replace(/[\s-]/g,"").toUpperCase();}
function lotKey(mode,o){const c=normCode(mode==="books"?o.isbn:o.sku);return c?("C:"+c):("N:"+String(o.name||"").trim().toLowerCase());}
function csvParse(text){const rows=[];let i=0,field="",row=[],q=false;const pushF=()=>{row.push(field);field="";};const pushR=()=>{pushF();rows.push(row);row=[];};
  while(i<text.length){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){field+='"';i++;}else q=false;}else field+=c;}
    else{if(c==='"')q=true;else if(c===",")pushF();else if(c==="\n")pushR();else if(c==="\r"){}else field+=c;}
    i++;}

function parseSalesCSV(text,mode){
  const rows=csvParse(text).filter(r=>r.some(c=>String(c).trim()!==""));
  if(rows.length<1)return {sales:[],matchedHeaders:{}};
  const header=rows[0].map(hh=>String(hh).trim().toLowerCase());
  const find=(...names)=>{for(const n of names){const i=header.indexOf(n);if(i>=0)return i;}return -1;};
  const ci={date:find("date","pvm","päivä","päiväys","sale date"),
    code:find("code","sku","ean","isbn","barcode","product code","tuotekoodi","viivakoodi"),
    name:find("name","product","title","tuote","nimi","tuotenimi","description","selite"),
    qty:find("qty","quantity","units","count","määrä","kpl","sold","myyty","amount sold"),
    price:find("unit price","price","amount","total","hinta","yhteensä","summa")};
  const hasHeader=ci.qty>=0||ci.code>=0||ci.name>=0;
  const start=hasHeader?1:0;
  const sales=[];
  for(let r=start;r<rows.length;r++){const row=rows[r];const get=i=>i>=0?String(row[i]||"").trim():"";
    let qty=parseNum(get(ci.qty)); if(qty==null&&!hasHeader)qty=parseNum(row[2]);
    if(qty==null)qty=1;
    const name=get(ci.name)||(!hasHeader?String(row[1]||"").trim():"");
    const code=get(ci.code)||(!hasHeader?String(row[0]||"").trim():"");
    if(!name&&!code)continue;
    sales.push({id:uid(),date:get(ci.date),code,name,qty,unitPrice:parseNum(get(ci.price)),note:""});}
  return {sales,matchedHeaders:ci,hasHeader};}
function computeStock(cfg){

    const inv=ws.invoices.find(i=>i.id===it.invoiceId);const date=((inv?inv.date:it.date)||"")||"9999-12-31";
    lots.push({id:it.id,item:it,key:lotKey(mode,it),recv,date,idx,sold:0});});
  const groups={};lots.forEach(l=>{(groups[l.key]=groups[l.key]||[]).push(l);});
  for(const k in groups)groups[k].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.idx-b.idx);
  const byCode={},byName={};
  lots.forEach(l=>{const it=l.item;const c=normCode(mode==="books"?it.isbn:it.sku);if(c)byCode["C:"+c]=l.key;
    const nm="N:"+String(it.name||"").trim().toLowerCase();if(nm!=="N:"){(byName[nm]=byName[nm]||new Set()).add(l.key);}});
  const sales=[...(ws.sales||[])].sort((a,b)=>(a.date||"")<(b.date||"")?-1:(a.date||"")>(b.date||"")?1:0);
  const unmatched=[];
  for(const s of sales){const q=+s.qty||0;if(q<=0)continue;let key=null;const sc=normCode(s.code);
    if(sc&&byCode["C:"+sc])key=byCode["C:"+sc];
    if(!key){const nm="N:"+String(s.name||"").trim().toLowerCase();if(nm!=="N:"&&byName[nm]&&byName[nm].size===1)key=[...byName[nm]][0];}
    if(!key||!groups[key]){unmatched.push({sale:s,qty:q,reason:"no match"});continue;}
    let rem=q;for(const l of groups[key]){if(rem<=0)break;const avail=l.recv-l.sold;if(avail<=0)continue;const take=Math.min(avail,rem);l.sold+=take;rem-=take;}
    if(rem>0)unmatched.push({sale:s,qty:rem,reason:"oversold"});}
  const byItem={};lots.forEach(l=>{byItem[l.id]={received:l.recv,sold:l.sold,onHand:l.recv-l.sold,sellThrough:l.recv>0?l.sold/l.recv:null};});
  return {lots,groups,byItem,unmatched};}
function invoiceSales(cfg,inv,stock){
  const {ws}=cfg;let recv=0,sold=0,realProfit=0,realRev=0;
  for(const it of ws.items){if(it.invoiceId!==inv.id||it.source==="own")continue;const b=stock.byItem[it.id];if(!b)continue;const d=derive(cfg,it);
    recv+=b.received;sold+=b.sold;realProfit+=b.sold*d.profit;realRev+=b.sold*d.retail;}
  const landed=invoiceAgg(cfg,inv).landed;
  return {received:recv,sold,onHand:recv-sold,sellThrough:recv>0?sold/recv:null,realProfit,realRev,landed,roi:landed>0?realProfit/landed:null};}
function salesTotals(cfg,stock){
  const {ws}=cfg;let recv=0,sold=0,onHandVal=0,realProfit=0,realRev=0,soldCost=0;
  for(const it of ws.items){if(it.forSale===false)continue;const b=stock.byItem[it.id];if(!b)continue;const d=derive(cfg,it);
    recv+=b.received;sold+=b.sold;onHandVal+=b.onHand*d.unitCost;realProfit+=b.sold*d.profit;realRev+=b.sold*d.retail;soldCost+=b.sold*d.unitCost;}
  return {received:recv,sold,onHand:recv-sold,sellThrough:recv>0?sold/recv:null,onHandVal,realProfit,realRev,soldCost,
    roi:soldCost>0?realProfit/soldCost:null,salesCount:(ws.sales||[]).length,unmatched:stock.unmatched.length,
    unmatchedUnits:stock.unmatched.reduce((a,u)=>a+(+u.qty||0),0)};}

  rows.sort((a,b)=>{const ka=key[sort.k](a),kb=key[sort.k](b);return (ka>kb?1:ka<kb?-1:0)*sort.dir;});
  const S=k=>setSort(s=>({k,dir:s.k===k?-s.dir:1}));const arrow=k=>sort.k===k?(sort.dir>0?" ↑":" ↓"):"";
  const cats=[...new Set(ws.items.map(i=>i.category).filter(Boolean))].sort();
  const visIds=rows.map(r=>r.it.id);const allSel=visIds.length>0&&visIds.every(id=>sel.has(id));

  const bulk=fn=>fn(selArr());
  const activeFilter=fcat||fsup||fav||fsrc||fissue||fkey||fsale||ql;
  const ISSUE_OPTS=[["","All issues"],["attention","Needs attention"],["noprice","No price"],["thin","Thin margin"],["loss","Loss-making"],["nocode",mode==="books"?"No ISBN":"No code"],["badcode","Invalid code"],["dup","Duplicate code"],["nocat",mode==="books"?"No section":"No category"]];
  return html`<div class="view">

      ${mode==="books"?html`<select class="filter" value=${fsrc} onChange=${e=>setFsrc(e.target.value)}><option value="">Purchased & own</option><option value="purchased">Purchased</option><option value="own">Own (KAT)</option></select>`:null}
      <select class="filter" value=${fissue} onChange=${e=>setFissue(e.target.value)}>${ISSUE_OPTS.map(([v,l])=>html`<option key=${v} value=${v}>${l}</option>`)}</select>

      <button class=${"btn sm"+(fav?" primary":"")} onClick=${()=>setFav(f=>!f)}>★ Flagged</button>
      ${activeFilter?html`<button class="btn sm" onClick=${()=>{setQ("");setFcat("");setFsup("");setFav(false);setFsrc("");setFissue("");setFkey("");setFsale("");}}>Clear</button>`:null}
      <span style=${{flex:1}}></span><span class="note">${rows.length} of ${ws.items.length}</span>
    </div>
    ${sel.size>0?html`<div class="bulkbar">

          ${it.forSale===false?html`<div style=${{marginTop:"4px"}}><span class="chip nosale">Not for sale</span></div>`:null}
          ${iss.filter(k=>k!=="notkeyed").length?html`<div class="idots">${iss.filter(k=>k!=="notkeyed").map(k=>html`<span key=${k} class=${"idot "+ISSUE_TIER[k]} title=${ISSUE_LABELS[k]}>${ISSUE_SHORT[k]}</span>`)}</div>`:null}</td>
        <td onClick=${()=>openItem(it,it.invoiceId)}><span class="chip cat">${it.category||"Other"}</span></td>
        <td onClick=${()=>openItem(it,it.invoiceId)}>${mode==="books"&&it.source==="own"?html`<span class="chip own">Own (KAT)</span>`:html`<${React.Fragment}>${supName(ws,invById(ws,it.invoiceId)?.supplierId)}<div class="meta code">${invById(ws,it.invoiceId)?.no||""}</div></${React.Fragment}>`}</td>

function Sales({cfg,act,show,openItem,openSale,openImport}){
  const {ws,mode,L}=cfg;
  const stock=computeStock(cfg);const ss=salesTotals(cfg,stock);
  const [q,setQ]=useState("");
  const unmatchedIds=new Set(stock.unmatched.map(u=>u.sale.id));
  let rows=[...ws.sales].sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const ql=q.trim().toLowerCase();
  if(ql)rows=rows.filter(s=>[s.date,s.code,s.name,s.note].join(" ").toLowerCase().includes(ql));
  function csv(){const head=["Date","Code","Name","Qty","Unit price","Note"];const lines=[head.join(",")];
    for(const s of ws.sales)lines.push([s.date,s.code,s.name,s.qty,s.unitPrice==null?"":s.unitPrice,s.note].map(c=>`"${String(c==null?"":c).replace(/"/g,'""')}"`).join(","));
    show("export","Sales — CSV",lines.join("\n"));}
  return html`<div class="view">
    <div class="rowbetween"><div><div class="eyebrow">Sell-through & ROI</div><div class="sectitle">Sales</div></div>
      <div class="hintrow"><button class="btn" onClick=${openImport}>Import sales (CSV)</button><button class="btn primary" onClick=${()=>openSale(null)}>＋ Add sale</button></div></div>
    <div class="tiles">
      <${Tile} lead k="Realized profit" v=${money(ss.realProfit)} foot=${"ROI "+(ss.roi==null?"—":pct(ss.roi))+" on sold cost"}/>
      <${Tile} k="Units sold" v=${num(ss.sold)} sm=${true} foot=${ss.salesCount+" sales"}/>
      <${Tile} k="Revenue (realized)" v=${money(ss.realRev)} sm=${true}/>
      <${Tile} k="Sell-through" v=${ss.sellThrough==null?"—":pct(ss.sellThrough)} sm=${true} foot=${num(ss.onHand)+" on hand"}/>
    </div>
    ${ss.unmatched>0?html`<div class="banner"><span>⚠ <b>${ss.unmatched}</b> ${ss.unmatched===1?"sale is":"sales are"} unmatched (${num(ss.unmatchedUnits)} units) — the ${mode==="books"?"ISBN":"code"} or name doesn't match a product.</span></div>`:null}
    <div class="toolbar"><div class="field search"><input type="text" placeholder="Search sales…" value=${q} onInput=${e=>setQ(e.target.value)}/></div>
      <span style=${{flex:1}}></span>${ws.sales.length?html`<button class="btn sm" onClick=${csv}>Copy as CSV</button>`:null}<span class="note">${rows.length} of ${ws.sales.length}</span></div>
    <div class="panel"><div class="tablewrap"><table><thead><tr><th>Date</th><th>Product</th><th>${mode==="books"?"ISBN":"Code"}</th><th class="num">Qty</th><th class="num">Unit price</th><th>Status</th><th></th></tr></thead>
    <tbody>${rows.map(s=>html`<tr key=${s.id} class="clickable" onClick=${()=>openSale(s)}>
      <td class="mono">${fmtD(s.date)||"—"}</td>
      <td><span class="name">${s.name||"(no name)"}</span>${s.note?html`<div class="meta">${s.note}</div>`:null}</td>
      <td class="code">${s.code||"—"}</td><td class="num">${num(s.qty)}</td><td class="num mono">${s.unitPrice==null?"—":money(s.unitPrice)}</td>
      <td>${unmatchedIds.has(s.id)?html`<span class="idot bad" title="Not matched to a product">unmatched</span>`:html`<span class="txt-good" style=${{fontSize:"12px",fontWeight:"600"}}>✓ matched</span>`}</td>
      <td class="num" onClick=${e=>{e.stopPropagation();act.deleteSale(s.id);show("toast","Sale deleted");}}><button class="btn link">Delete</button></td></tr>`)}
      ${rows.length===0?html`<tr><td colSpan="7" class="note" style=${{padding:"26px",textAlign:"center"}}>${ws.sales.length===0?"No sales yet. Import a CSV from Vektori / WooCommerce, or add one.":"No sales match."}</td></tr>`:null}</tbody></table></div></div>
  </div>`;}

function SaleModal({cfg,act,editing,onClose,show}){
  const {ws,mode}=cfg;
  const blank={id:null,date:new Date().toISOString().slice(0,10),code:"",name:"",qty:"",unitPrice:"",note:""};
  const [f,setF]=useState(editing?{...editing,qty:String(editing.qty??""),unitPrice:editing.unitPrice==null?"":String(editing.unitPrice)}:blank);
  const up=(k,v)=>setF(o=>({...o,[k]:v}));
  const names=[...new Set(ws.items.map(i=>i.name).filter(Boolean))];
  function submit(){if(!String(f.name).trim()&&!String(f.code).trim()){show("toast","Enter a product name or code");return;}
    act.saveSale({...f,qty:parseNum(f.qty)||0,unitPrice:parseNum(f.unitPrice),example:editing?editing.example:false});
    show("toast",editing?"Sale updated":"Sale added");onClose();}
  return html`<${Modal} title=${editing?"Edit sale":"New sale"} onClose=${onClose}
    footer=${html`<${React.Fragment}>${editing?html`<button class="btn danger" style=${{marginRight:"auto"}} onClick=${()=>{act.deleteSale(editing.id);show("toast","Sale deleted");onClose();}}>Delete</button>`:null}<button class="btn" onClick=${onClose}>Cancel</button><button class="btn primary" onClick=${submit}>${editing?"Save":"Add sale"}</button></${React.Fragment}>`}>
    <div class="grid2"><div><label class="lab">Date</label><input type="date" value=${f.date} onInput=${e=>up("date",e.target.value)}/></div>
      <div><label class="lab">Quantity sold</label><input type="text" inputmode="decimal" value=${f.qty} onInput=${e=>up("qty",e.target.value)}/></div></div>
    <div><label class="lab">Product name</label><input list="kk-prodnames" type="text" value=${f.name} onInput=${e=>up("name",e.target.value)} placeholder="matches catalogue by name"/>
      <datalist id="kk-prodnames">${names.map(n=>html`<option key=${n} value=${n}></option>`)}</datalist></div>
    <div class="grid2"><div><label class="lab">${mode==="books"?"ISBN":"SKU / EAN"} (optional)</label><input class="mono" type="text" value=${f.code} onInput=${e=>up("code",e.target.value)}/></div>
      <div><label class="lab">Unit price € (optional)</label><input class="mono" type="text" inputmode="decimal" value=${f.unitPrice} onInput=${e=>up("unitPrice",e.target.value)}/></div></div>
    <div><label class="lab">Note</label><input type="text" value=${f.note} onInput=${e=>up("note",e.target.value)}/></div>
    <div class="note">Matched to a product by ${mode==="books"?"ISBN, then name":"code, then name"}. FIFO depletes the oldest lot first.</div>
  </${Modal}>`;}

function SalesImportModal({cfg,act,onClose,show}){
  const {mode}=cfg;const [txt,setTxt]=useState("");const [err,setErr]=useState("");const [preview,setPreview]=useState(null);const fileRef=useRef();
  function parse(t){try{const r=parseSalesCSV(t,mode);setPreview(r.sales);setErr(r.sales.length?"":"No rows found — check the format.");}catch(e){setErr("Couldn't parse that CSV.");setPreview(null);}}
  function onFile(e){const file=e.target.files&&e.target.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{const v=String(rd.result);setTxt(v);parse(v);};rd.readAsText(file);e.target.value="";}
  function run(){if(!preview||!preview.length){setErr("Nothing to import.");return;}act.importSales(preview);show("toast","Imported "+preview.length+" sales");onClose();}
  return html`<${Modal} wide=${true} title="Import sales (CSV)" onClose=${onClose}
    footer=${html`<${React.Fragment}><button class="btn" onClick=${onClose}>Cancel</button><button class="btn primary" onClick=${run} disabled=${!preview||!preview.length}>Import ${preview?preview.length:0} sales</button></${React.Fragment}>`}>
    <div class="note">Paste or open a CSV exported from Vektori or WooCommerce. Columns are detected by header — it looks for <b>date</b>, <b>code / sku / ean / isbn</b>, <b>name / product / title</b>, <b>qty / quantity / kpl</b>, and optionally <b>price</b>. Column order doesn't matter.</div>
    <div class="hintrow"><button class="btn sm" onClick=${()=>fileRef.current&&fileRef.current.click()}>Choose file…</button><input ref=${fileRef} type="file" accept=".csv,text/csv" style=${{display:"none"}} onChange=${onFile}/></div>
    <textarea class="io" value=${txt} onInput=${e=>{setTxt(e.target.value);parse(e.target.value);}} placeholder="Paste CSV rows here…"></textarea>
    ${err?html`<div class="valid no">${err}</div>`:null}
    ${preview&&preview.length?html`<div class="note">Ready: <b>${preview.length}</b> rows. First: ${preview[0].name||preview[0].code} ×${preview[0].qty}${preview[0].date?(" on "+preview[0].date):""}.</div>`:null}
  </${Modal}>`;}

function Reorder({cfg,act,show}){
  const {ws,mode,L}=cfg;
  const rows=ws.items.filter(i=>i.favorite).map(it=>({it,d:derive(cfg,it)}));
  const grp={};for(const r of rows){const s=r.it.source==="own"?"Own (KAT)":supName(ws,invById(ws,r.it.invoiceId)?.supplierId);(grp[s]=grp[s]||[]).push(r);}
  function csv(){const head=mode==="books"?["Source","Title","Author","ISBN","Publisher","Section","Last unit cost (net)","Notes"]:["Supplier","SKU/EAN","Supplier Art.","Item Ref","Item name","Category","Last unit cost","Notes"];
    const lines=[head.join(",")];for(const r of rows){const src=r.it.source==="own"?"Own (KAT)":supName(ws,invById(ws,r.it.invoiceId)?.supplierId);
      const row=mode==="books"?[src,r.it.name,r.it.author,r.it.isbn,r.it.publisher,r.it.category,r.d.unitCost.toFixed(2),r.it.notes]
        :[src,r.it.sku,r.it.supplierArt,r.it.ref,r.it.name,r.it.category,r.d.unitCost.toFixed(2),r.it.notes];
      lines.push(row.map(c=>`"${String(c==null?"":c).replace(/"/g,'""')}"`).join(","));}
    show("export","Reorder list — CSV",lines.join("\n"));}
  return html`<div class="view">
    <div class="rowbetween"><div><div class="eyebrow">Shopping list</div><div class="sectitle">To reorder</div></div>
      ${rows.length?html`<button class="btn" onClick=${csv}>Copy as CSV</button>`:null}</div>
    ${rows.length===0?html`<div class="panel"><div class="empty"><div class="big">Nothing flagged</div><div class="note">Tap the ★ beside any ${L.item} to add it here.</div></div></div>`:
    Object.entries(grp).map(([g,list])=>html`<div class="panel" key=${g}>
      <div class="panel-h"><h3>${g}</h3><span class="note">${list.length} ${list.length===1?L.item:L.itemsLower}</span></div>
      <div class="tablewrap"><table><thead><tr><th style=${{width:"28px"}}></th><th>${L.item[0].toUpperCase()+L.item.slice(1)}</th><th>${mode==="books"?"Section":"Category"}</th><th>${mode==="books"?"ISBN":"Codes"}</th><th class="num">Last unit cost</th></tr></thead>
      <tbody>${list.map(({it,d})=>html`<tr key=${it.id}><td onClick=${()=>act.toggleFav(it.id)}><${Star} on=${true} onClick=${()=>{}}/></td>
        <td><span class="name">${it.name}</span>${(mode==="books"?it.author:it.notes)?html`<div class="meta">${mode==="books"?it.author:it.notes}</div>`:null}</td>
        <td><span class="chip cat">${it.category||"Other"}</span></td>
        <td class="code">${mode==="books"?(it.isbn||""):(it.sku||"")}${(!mode||mode==="goods")&&it.supplierArt?html`<div>${it.supplierArt}</div>`:null}</td>
        <td class="num mono">${money(d.unitCost)}</td></tr>`)}</tbody></table></div></div>`)}
  </div>`;}

/* ---- Suppliers ---- */
function Suppliers({cfg,openSupplier}){
  const {ws,mode,L}=cfg;
  const rows=ws.suppliers.map(s=>{const invs=ws.invoices.filter(i=>i.supplierId===s.id);
    let units=0,net=0,retail=0,profit=0,items=0;
    for(const inv of invs){const a=invoiceAgg(cfg,inv);units+=a.units;net+=a.landed;retail+=a.retail;profit+=a.profit;items+=a.lines;}
    return {s,invs:invs.length,items,units,net,retail,profit,margin:retail>0?profit/retail:null};
  }).sort((a,b)=>b.net-a.net);
  return html`<div class="view">
    <div class="rowbetween"><div><div class="eyebrow">${mode==="books"?"Publishers & distributors":"Sources"}</div><div class="sectitle">Suppliers</div></div>
      <button class="btn primary" onClick=${()=>openSupplier(null)}>＋ New supplier</button></div>
    <div class="panel"><div class="tablewrap"><table><thead><tr>
      <th>Name</th><th>Country</th><th class="num">${L.invs}</th><th class="num">${L.items}</th>
      <th class="num">Units</th><th class="num" title="Net landed cost (ex-VAT), incl. transport">Net cost</th><th class="num">Retail</th><th class="num">Margin</th><th></th></tr></thead>
      <tbody>${rows.map(({s,invs,items,units,net,retail,margin})=>html`<tr key=${s.id}>
        <td><span class="name">${s.name}</span></td><td>${s.country||"—"}</td>
        <td class="num">${invs}</td><td class="num">${items}</td><td class="num">${num(units)}</td>
        <td class="num mono">${money(net)}</td><td class="num mono">${money(retail)}</td>

function InvoiceModal({cfg,act,editing,onClose,show}){
  const {ws,mode,L}=cfg;
  const [f,setF]=useState(editing?{...editing,transport:String(editing.transport??"")}:{id:null,no:"",supplierId:ws.suppliers[0]?ws.suppliers[0].id:"__new",date:new Date().toISOString().slice(0,10),country:"",transport:"",vatInCost:true});
  const [newSup,setNewSup]=useState({name:"",country:""});
  const up=(k,v)=>setF(o=>({...o,[k]:v}));
  const creatingSup=f.supplierId==="__new"||ws.suppliers.length===0;
  function submit(){let supId=f.supplierId;
    if(creatingSup){if(!newSup.name.trim()){show("toast","Name the supplier");return;}supId=act.addSupplier(newSup.name.trim(),newSup.country.trim());}
    act.saveInvoice({...f,supplierId:supId,transport:parseNum(f.transport)||0,example:editing?editing.example:false});show("toast",editing?(L.invOne+" updated"):(L.invOne+" created"));onClose();}
  return html`<${Modal} title=${editing?("Edit "+L.inv):("New "+L.inv)} onClose=${onClose}
    footer=${html`<${React.Fragment}>${editing?html`<button class="btn danger" style=${{marginRight:"auto"}} onClick=${()=>{act.deleteInvoice(editing.id);show("toast",L.invOne+" deleted");onClose();}}>Delete</button>`:null}
      <button class="btn" onClick=${onClose}>Cancel</button><button class="btn primary" onClick=${submit}>${editing?"Save changes":("Create "+L.inv)}</button></${React.Fragment}>`}>
    <div class="grid2"><div><label class="lab">${L.invOne} number</label><input class="mono" type="text" value=${f.no} onInput=${e=>up("no",e.target.value)} placeholder=${mode==="books"?"e.g. 924057840":"e.g. 2008640"}/></div>
      <div><label class="lab">Date received</label><input type="date" value=${f.date} onInput=${e=>up("date",e.target.value)}/></div></div>
    <div><label class="lab">Supplier</label><select value=${f.supplierId} onChange=${e=>up("supplierId",e.target.value)}>${ws.suppliers.map(s=>html`<option key=${s.id} value=${s.id}>${s.name}</option>`)}<option value="__new">＋ New supplier…</option></select>
      ${creatingSup?html`<div class="grid2" style=${{marginTop:"8px"}}><input type="text" placeholder="Supplier name" value=${newSup.name} onInput=${e=>setNewSup(o=>({...o,name:e.target.value}))}/><input type="text" placeholder="Country" value=${newSup.country} onInput=${e=>setNewSup(o=>({...o,country:e.target.value}))}/></div>`:null}</div>
    <div class="grid2"><div><label class="lab">Country of origin</label><input type="text" value=${f.country} onInput=${e=>up("country",e.target.value)} placeholder="e.g. Finland"/></div>
      <div><label class="lab">Transport cost (€)</label><input class="mono" type="text" inputmode="decimal" value=${f.transport} onInput=${e=>up("transport",e.target.value)}/><div class="note">Spread per ${L.unit} across this ${L.inv}.</div></div></div>
    ${true?html`<div style=${{background:"var(--surface-2)",border:"1px solid var(--line)",borderRadius:"var(--radius-sm)",padding:"11px 13px",display:"flex",gap:"11px",alignItems:"center"}}>
      <input id="vic" type="checkbox" style=${{width:"auto"}} checked=${!!f.vatInCost} onChange=${e=>up("vatInCost",e.target.checked)}/>
      <label for="vic" style=${{cursor:"pointer"}}><b>Cost includes recoverable Finnish VAT</b><div class="note">On for domestic (FI) purchases — input VAT is stripped to a net cost. Off for imports billed without FI VAT.</div></label></div>`:null}
  </${Modal}>`;}

function SupplierModal({cfg,act,editing,onClose,show}){
  const {ws}=cfg;const [f,setF]=useState(editing?{...editing}:{id:null,name:"",country:""});const up=(k,v)=>setF(o=>({...o,[k]:v}));
  function submit(){if(!f.name.trim()){show("toast","Name the supplier");return;}act.saveSupplier({...f,name:f.name.trim(),country:f.country.trim()});show("toast",editing?"Supplier updated":"Supplier added");onClose();}
  const used=editing&&ws.invoices.some(i=>i.supplierId===editing.id);
  return html`<${Modal} title=${editing?"Edit supplier":"New supplier"} onClose=${onClose}
    footer=${html`<${React.Fragment}>${editing&&!used?html`<button class="btn danger" style=${{marginRight:"auto"}} onClick=${()=>{act.deleteSupplier(editing.id);show("toast","Supplier removed");onClose();}}>Delete</button>`:null}
      <button class="btn" onClick=${onClose}>Cancel</button><button class="btn primary" onClick=${submit}>${editing?"Save":"Add supplier"}</button></${React.Fragment}>`}>
    <div><label class="lab">Name</label><input type="text" value=${f.name} onInput=${e=>up("name",e.target.value)}/></div>
    <div><label class="lab">Country</label><input type="text" value=${f.country} onInput=${e=>up("country",e.target.value)}/></div>
    ${editing&&used?html`<div class="note">In use by existing ${cfg.L.invs.toLowerCase()}, so it can't be deleted.</div>`:null}
  </${Modal}>`;}

function ExportModal({title,text,onClose,show}){
  const ref=useRef();
  function copy(){try{navigator.clipboard.writeText(text).then(()=>show("toast","Copied to clipboard"),()=>{ref.current.select();show("toast","Selected — press Ctrl/⌘ C");});}catch(e){ref.current.select();show("toast","Selected — press Ctrl/⌘ C");}}
  return html`<${Modal} wide=${true} title=${title} onClose=${onClose} footer=${html`<${React.Fragment}><button class="btn" onClick=${onClose}>Close</button><button class="btn primary" onClick=${copy}>Copy all</button></${React.Fragment}>`}>
    <div class="note">Downloads are blocked in this view, so copy the text and paste it into a spreadsheet or a saved file.</div>
    <textarea class="io" ref=${ref} readOnly value=${text} onFocus=${e=>e.target.select()}></textarea></${Modal}>`;}

function ImportModal({act,onClose,show}){
  const [txt,setTxt]=useState("");const [err,setErr]=useState("");
  function run(){try{const o=JSON.parse(txt);if(isEncrypted(o)){onClose();act.openDecrypt(o);return;}if(!isCoreLike(o))throw 0;act.replaceAll(o);show("toast","Data loaded");onClose();}catch(e){setErr("That doesn't look like a data file. Paste the full JSON from Save/Copy.");}}
  return html`<${Modal} wide=${true} title="Paste data" onClose=${onClose} footer=${html`<${React.Fragment}><button class="btn" onClick=${onClose}>Cancel</button><button class="btn primary" onClick=${run} disabled=${!txt.trim()}>Replace all data</button></${React.Fragment}>`}>
    <div class="note">Paste the JSON from Save or Copy (a core data file). This replaces everything in the desk (both modes).</div>
    <textarea class="io" value=${txt} onInput=${e=>{setTxt(e.target.value);setErr("");}} placeholder="Paste backup JSON here…"></textarea>
    ${err?html`<div class="valid no">${err}</div>`:null}</${Modal}>`;}

function ConfirmModal({title,body,confirmLabel,onConfirm,onClose}){
  return html`<${Modal} title=${title} onClose=${onClose} footer=${html`<${React.Fragment}><button class="btn" onClick=${onClose}>Cancel</button><button class="btn danger" onClick=${()=>{onConfirm();onClose();}}>${confirmLabel}</button></${React.Fragment}>`}>
    <div>${body}</div></${Modal}>`;}

function PassModal({mode,onSubmit,onClose}){
  const [p1,setP1]=useState("");const [p2,setP2]=useState("");const [err,setErr]=useState("");const [busy,setBusy]=useState(false);
  async function go(){if(!p1){setErr("Enter a passphrase");return;}if(mode==="save"&&p1!==p2){setErr("Passphrases don't match");return;}
    setBusy(true);setErr("");try{await onSubmit(p1);}catch(e){setErr(mode==="open"?"Wrong passphrase, or the file is corrupted.":"Could not encrypt — try again.");setBusy(false);}}
  const onKey=e=>{if(e.key==="Enter")go();};
  return html`<${Modal} title=${mode==="save"?"Encrypt & save":"Encrypted file"} onClose=${onClose}
    footer=${html`<${React.Fragment}><button class="btn" onClick=${onClose}>Cancel</button><button class="btn primary" onClick=${go} disabled=${busy}>${busy?"Working…":(mode==="save"?"Encrypt & save":"Unlock")}</button></${React.Fragment}>`}>
    <div class="note">${mode==="save"?"The file is encrypted with AES-256 from this passphrase. It can only be opened with the passphrase — there is no recovery if you forget it.":"This file is encrypted. Enter its passphrase to load it."}</div>
    <div><label class="lab">Passphrase</label><input type="password" value=${p1} onInput=${e=>setP1(e.target.value)} onKeyDown=${mode==="open"?onKey:undefined} autoFocus/></div>
    ${mode==="save"?html`<div><label class="lab">Confirm passphrase</label><input type="password" value=${p2} onInput=${e=>setP2(e.target.value)} onKeyDown=${onKey}/></div>`:null}
    ${err?html`<div class="valid no">${err}</div>`:null}
  </${Modal}>`;}

/* ================= app ================= */
function App(){
  const [st,setSt]=useState(()=>load());
  const [tab,setTab]=useState(()=>{try{return localStorage.getItem("kk-tab")||"dashboard";}catch(e){return "dashboard";}});
  const [theme,setTheme]=useState(()=>{try{return localStorage.getItem("kk-theme")||"system";}catch(e){return"system";}});
  const [modal,setModal]=useState(null);const [toast,setToast]=useState(null);const [itemsPreset,setItemsPreset]=useState(null);
  useEffect(()=>save(st),[st]);
  useEffect(()=>{const r=document.documentElement;if(theme==="system")delete r.dataset.theme;else r.dataset.theme=theme;try{localStorage.setItem("kk-theme",theme);}catch(e){}},[theme]);
  useEffect(()=>{if(!toast)return;const h=setTimeout(()=>setToast(null),1900);return()=>clearTimeout(h);},[toast]);
  useEffect(()=>{try{localStorage.setItem("kk-tab",tab);}catch(e){}},[tab]);
  useEffect(()=>{const h=e=>{if(e.key==="Escape")setModal(null);};window.addEventListener("keydown",h);return()=>window.removeEventListener("keydown",h);},[]);

  const mode=st.mode;const ws=st[mode];
  const L=mode==="books"
    ?{unit:"copy",units:"copies",item:"title",items:"Titles",itemsLower:"titles",inv:"batch",invs:"Batches",invOne:"Batch",addItem:"＋ Add title",addInv:"＋ New batch"}
    :{unit:"unit",units:"units",item:"item",items:"Items",itemsLower:"items",inv:"invoice",invs:"Invoices",invOne:"Invoice",addItem:"＋ Add item",addInv:"＋ New invoice"};
  const cfg={mode,ws,L};
  const show=(type,title,text)=>{if(type==="toast"){setToast(title);return;}setModal({type,title,text});};
  const t=useMemo(()=>totals(cfg),[st,mode]);
  const uiStock=useMemo(()=>computeStock(cfg),[st,mode]);

  const edit=fn=>setSt(s=>({...s,[s.mode]:fn(s[s.mode])}));
  const act={
    fullState:()=>st,
    toggleFav:id=>edit(w=>({...w,items:w.items.map(i=>i.id===id?{...i,favorite:!i.favorite}:i)})),
    saveItem:rec=>edit(w=>rec.id?{...w,items:w.items.map(i=>i.id===rec.id?rec:i)}:{...w,items:[...w.items,{...rec,id:uid()}]}),
    deleteItem:id=>edit(w=>({...w,items:w.items.filter(i=>i.id!==id)})),
    saveInvoice:rec=>edit(w=>rec.id?{...w,invoices:w.invoices.map(i=>i.id===rec.id?rec:i)}:{...w,invoices:[...w.invoices,{...rec,id:uid()}]}),
    deleteInvoice:id=>edit(w=>({...w,invoices:w.invoices.filter(i=>i.id!==id),items:w.items.filter(i=>i.invoiceId!==id)})),
    addSupplier:(name,country)=>{const id=uid();edit(w=>({...w,suppliers:[...w.suppliers,{id,name,country}]}));return id;},
    saveSupplier:rec=>edit(w=>rec.id?{...w,suppliers:w.suppliers.map(x=>x.id===rec.id?rec:x)}:{...w,suppliers:[...w.suppliers,{...rec,id:uid()}]}),
    deleteSupplier:id=>edit(w=>({...w,suppliers:w.suppliers.filter(x=>x.id!==id)})),
    setSettings:ns=>edit(w=>({...w,settings:ns})),
    toggleKeyed:id=>edit(w=>({...w,items:w.items.map(i=>i.id===id?{...i,keyed:!i.keyed}:i)})),
    bulkSet:(ids,patch)=>edit(w=>({...w,items:w.items.map(i=>ids.has(i.id)?{...i,...patch}:i)})),
    bulkRetailSuggested:ids=>edit(w=>({...w,items:w.items.map(i=>{if(!ids.has(i.id))return i;const d=derive({mode,ws:w},i);return {...i,retail:r2(d.suggested)};})})),
    bulkRetail90:ids=>edit(w=>({...w,items:w.items.map(i=>{if(!ids.has(i.id))return i;const d=derive({mode,ws:w},i);const b=Math.floor(d.suggested);const o=[b-0.1,b+0.9].filter(x=>x>0);let best=o[0];for(const x of o)if(Math.abs(x-d.suggested)<Math.abs(best-d.suggested))best=x;return {...i,retail:r2(best)};})})),
    saveSale:rec=>edit(w=>rec.id&&w.sales.some(x=>x.id===rec.id)?{...w,sales:w.sales.map(x=>x.id===rec.id?rec:x)}:{...w,sales:[...w.sales,{...rec,id:rec.id||uid()}]}),
    deleteSale:id=>edit(w=>({...w,sales:w.sales.filter(x=>x.id!==id)})),
    importSales:list=>edit(w=>({...w,sales:[...w.sales,...list.map(s=>({...s,id:s.id||uid()}))]})),
    clearSales:()=>edit(w=>({...w,sales:[]})),
    clearExamples:()=>edit(w=>({...w,items:w.items.filter(i=>!i.example),invoices:w.invoices.filter(i=>!i.example),suppliers:w.suppliers.filter(x=>!x.example),sales:w.sales.filter(x=>!x.example)})),
    wipe:()=>edit(()=>mode==="books"?normBooks({}):normGoods({})),
    replaceAll:raw=>setSt(s=>{const o=readCore(raw);
      if(o&&(o.goods||o.books))return migrate({...s,mode:o.mode||s.mode,goods:o.goods?normGoods(o.goods):s.goods,books:o.books?normBooks(o.books):s.books});
      return migrate({...s,goods:normGoods(o)});}),
    loadCatalogue:()=>edit(()=>st.mode==="books"?seedBooks():seedGoods()),
    openEncrypt:()=>setModal({type:"encsave"}),
    openDecrypt:obj=>setModal({type:"encopen",payload:obj}),
  };
  const openItem=(it,invId)=>setModal({type:mode==="books"?"book":"item",editing:it,fixedInvoiceId:invId});
  const openInvoice=inv=>setModal({type:"invoice",editing:inv});
  const openSupplier=s=>setModal({type:"supplier",editing:s});
  const openSale=s=>setModal({type:"sale",editing:s});
  const goItems=k=>{setItemsPreset(k);setTab("items");};

  const hasExamples=ws.items.some(i=>i.example)||ws.invoices.some(i=>i.example);
  const tabs=[["dashboard","Dashboard"],["invoices",L.invs],["items",L.items],["sales","Sales",uiStock.unmatched.length||null],["reorder","Reorder",t.reorder],["suppliers","Suppliers"],["settings","Settings"]];
  const themeLabel={system:"◐ System",light:"☀ Light",dark:"☾ Dark"}[theme];
  const cycle=()=>setTheme(p=>p==="system"?"light":p==="light"?"dark":"system");
  const setMode=m=>setSt(s=>({...s,mode:m}));

  return html`<${React.Fragment}>
    <div class="appbar"><div class="appbar-in">
      <div class="wordmark"><span class="mk">✦</span><span>Import Desk</span><span class="sub">${ws.settings.shop}</span></div>
      <div class="seg" role="group" aria-label="Mode">
        <button aria-pressed=${mode==="goods"} onClick=${()=>setMode("goods")}>Goods</button>
        <button aria-pressed=${mode==="books"} onClick=${()=>setMode("books")}>Books</button></div>
      <span class="spacer"></span>
      <button class="iconbtn ghost" onClick=${cycle} title="Theme">${themeLabel}</button>
    </div></div>
    <div class="rail"><div class="rail-in">
      ${tabs.map(([id,label,pip])=>html`<button key=${id} class="tab" role="tab" aria-selected=${tab===id} onClick=${()=>setTab(id)}>${label}${pip?html`<span class="pip">${pip}</span>`:null}</button>`)}
    </div></div>
    <div class="wrap">
      ${hasExamples&&tab!=="settings"?html`<div class="banner" style=${{marginBottom:"18px"}}>
        <span><b>Example ${mode==="books"?"books":"goods"}</b> are loaded so you can see how it works. Remove them when you're ready.</span>
        <span class="spacer"></span><button class="btn sm" onClick=${()=>act.clearExamples()}>Clear examples</button></div>`:null}
      ${tab==="dashboard"?html`<${Dashboard} cfg=${cfg} t=${t} go=${setTab} goItems=${goItems} openItem=${openItem}/>`:null}
      ${tab==="invoices"?html`<${Invoices} key=${mode} cfg=${cfg} act=${act} openItem=${openItem} openInvoice=${openInvoice}/>`:null}
      ${tab==="items"?html`<${Items} key=${mode} cfg=${cfg} act=${act} openItem=${openItem} preset=${itemsPreset} clearPreset=${()=>setItemsPreset(null)}/>`:null}
      ${tab==="sales"?html`<${Sales} key=${mode} cfg=${cfg} act=${act} show=${show} openItem=${openItem} openSale=${openSale} openImport=${()=>setModal({type:"salesimport"})}/>`:null}
      ${tab==="reorder"?html`<${Reorder} cfg=${cfg} act=${act} show=${show}/>`:null}
      ${tab==="suppliers"?html`<${Suppliers} cfg=${cfg} openSupplier=${openSupplier}/>`:null}
      ${tab==="settings"?html`<${Settings} cfg=${cfg} act=${act} show=${show}/>`:null}
    </div>
    ${modal&&modal.type==="item"?html`<${ItemModal} cfg=${cfg} act=${act} editing=${modal.editing} fixedInvoiceId=${modal.fixedInvoiceId} onClose=${()=>setModal(null)} show=${show}/>`:null}
    ${modal&&modal.type==="book"?html`<${BookModal} cfg=${cfg} act=${act} editing=${modal.editing} fixedInvoiceId=${modal.fixedInvoiceId} onClose=${()=>setModal(null)} show=${show}/>`:null}
    ${modal&&modal.type==="invoice"?html`<${InvoiceModal} cfg=${cfg} act=${act} editing=${modal.editing} onClose=${()=>setModal(null)} show=${show}/>`:null}
    ${modal&&modal.type==="supplier"?html`<${SupplierModal} cfg=${cfg} act=${act} editing=${modal.editing} onClose=${()=>setModal(null)} show=${show}/>`:null}
    ${modal&&modal.type==="sale"?html`<${SaleModal} cfg=${cfg} act=${act} editing=${modal.editing} onClose=${()=>setModal(null)} show=${show}/>`:null}
    ${modal&&modal.type==="salesimport"?html`<${SalesImportModal} cfg=${cfg} act=${act} onClose=${()=>setModal(null)} show=${show}/>`:null}
    ${modal&&modal.type==="export"?html`<${ExportModal} title=${modal.title} text=${modal.text} onClose=${()=>setModal(null)} show=${show}/>`:null}
    ${modal&&modal.type==="import"?html`<${ImportModal} act=${act} onClose=${()=>setModal(null)} show=${show}/>`:null}
    ${modal&&modal.type==="wipe"?html`<${ConfirmModal} title=${"Erase "+(mode==="books"?"books":"goods")+" data?"} confirmLabel="Erase this mode"
      body=${html`<span>This clears every supplier, ${L.inv} and ${L.item} in ${mode==="books"?"Books":"Goods"}. The other mode is untouched. Export a backup first if you might want it back.</span>`}
      onConfirm=${act.wipe} onClose=${()=>setModal(null)}/>`:null}
    ${modal&&modal.type==="encsave"?html`<${PassModal} mode="save" onClose=${()=>setModal(null)} onSubmit=${async pass=>{
      const text=JSON.stringify(await encryptCore(st,pass),null,2);const name="kk-import-desk_core_"+stamp()+".enc.json";
      if(IN_FRAME){setModal({type:"export",title:"Encrypted core file — copy and keep safe",text});return;}
      if(downloadText(name,text)){setModal(null);setToast("Saved "+name);}else setModal({type:"export",title:"Encrypted core file — copy and keep safe",text});}}/>`:null}
    ${modal&&modal.type==="encopen"?html`<${PassModal} mode="open" onClose=${()=>setModal(null)} onSubmit=${async pass=>{
      const data=await decryptCore(modal.payload,pass);act.replaceAll(data);setModal(null);setToast("Data loaded");}}/>`:null}
    ${toast?html`<div class="toast">${toast}</div>`:null}
  </${React.Fragment}>`;}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
